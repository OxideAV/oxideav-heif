name: CI

# Two CI paths:
#
# * `ci` (default-features) — uses the OxideAV org-level reusable workflow,
#   which exercises the registry-integrated path (oxideav-core +
#   oxideav-h265 + oxideav-av1 deps + Decoder trait impls).
# * `ci-standalone` (no-default-features) — inline job that builds and
#   tests the crate with `--no-default-features`, exercising the
#   `oxideav-core`-free standalone path: the image-crate contract's
#   `probe` / `info` / `HeifImage` vocabulary, the HEIF parser and the
#   composition layer on the crate-local HeifFrame / HeifPixelFormat /
#   HeifError (`tests/api.rs` runs its standalone half; the registry
#   tests are `cfg`-gated out). Catches regressions where pipeline
#   modules accidentally regrow an oxideav-core / codec import.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    secrets: inherit

  ci-standalone:
    name: Build & test (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: standalone

      - name: Build (no-default-features)
        run: cargo build --no-default-features --all-targets --verbose

      - name: Test (no-default-features)
        run: cargo test --no-default-features --verbose

      - name: Clippy (no-default-features)
        run: cargo clippy --no-default-features --all-targets --no-deps -- -D warnings
