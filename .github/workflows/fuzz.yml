name: Fuzz

# Daily scheduled run of the cargo-fuzz harnesses under fuzz/ via the
# OxideAV org-level reusable workflow (see OxideAV/.github). The
# 30-minute budget is split evenly across the six targets
# (heif_parse, heif_compose, heif_sequence, heif_records, heif_api,
# heif_decode — ~5 min each).

on:
  schedule:
    - cron: "17 4 * * *" # daily 04:17 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit
