[package]
name = "oxideav-heif"
version = "0.0.14"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-heif"
authors = ["Mark Karpeles"]
description = "Pure-Rust HEIF / HEIC / MIAF image container (ISO/IEC 23008-12, 23000-22) for oxideav — items, derivations (grid / overlay / identity), auxiliaries, properties, sequences; HEVC, AV1, AVC and VVC items decoded through the oxideav codec crates"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-heif"
keywords = ["multimedia", "image", "heif", "heic", "container"]
categories = ["multimedia::encoding", "multimedia::images"]
# crates.io package: keep the integration tests and the fuzz sub-crate
# (with its corpus) out of the upload.
exclude = ["/tests", "/fuzz"]

[dependencies]
# Framework + codec deps are gated behind the default-on `registry`
# feature. With the feature off the crate exposes the standalone
# container parser + composition layer (crate-local HeifFrame /
# HeifPixelFormat / HeifError) and never references the framework or a
# codec crate.
# 0.1.41: `CodecCapabilities::embedded_blob_kinds` (the still encoder
# declares ICC / Exif / XMP) and the `Muxer::set_metadata` /
# `carries_metadata_key` text hook (the sequence muxer's `cprt`).
oxideav-core = { version = "0.1.41", optional = true }
# A 0.0.x caret requirement is exact; the range keeps heif on the latest
# h265 0.0 line (0.0.15: hostile-input hardening of the CABAC
# binarizations and the parameter-set bounds the HEIF fuzzer reached).
oxideav-h265 = { version = ">=0.0.15, <0.1", optional = true }
# 0.1.9: the registry encoder rotates idr_pic_id itself, takes every
# High-family layout, `format=avcc`, and ships the avcC record module.
oxideav-h264 = { version = "0.1.9", optional = true }
# 0.1.21: the decoder takes an ExecutionContext budget (tile / band /
# wave / stripe parallel, byte-identical at any budget).
oxideav-av1 = { version = "0.1.21", optional = true }
# VVC items (HEIF Annex L) decode / encode through the workspace's own
# VVC crate; its registry factory is a parser-only placeholder on the
# 0.0 line, so `vvcdec` drives `stream::StreamDecoder` directly. 0.0.10:
# any picture geometry, 4:0:0 / 4:2:2 / 4:4:4, 10-bit, lossless.
oxideav-h266 = { version = ">=0.0.10, <0.1", optional = true }
# Inflate for deflate-compressed metadata items (`dExf`, deflated XMP;
# HEIF Amd 2:2026 A.2.1 / O.4.3). Optional: `deflate` feature.
compcol = { version = "0.6", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
# Test-only: inflate for the PNG oracle reader (`tests/common/png.rs`)
# that compares decoded pixels against the corpus `expected*.png`.
compcol = { version = "0.6", default-features = false, features = ["zlib"] }

[features]
default = ["registry", "deflate"]
deflate = ["dep:compcol"]
registry = [
    "dep:oxideav-core",
    "dep:oxideav-h265",
    "dep:oxideav-h264",
    "dep:oxideav-av1",
    "dep:oxideav-h266",
]

[[example]]
name = "heifdump"
required-features = ["registry"]

[[example]]
name = "heifenc"
required-features = ["registry"]

[[example]]
name = "heifbench"
required-features = ["registry"]

[[example]]
name = "heifencbench"
required-features = ["registry"]

[[example]]
name = "heifsoak"
required-features = ["registry"]
