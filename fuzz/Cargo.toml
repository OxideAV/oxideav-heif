[package]
name = "oxideav-heif-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# The container layer consumes unbounded attacker-controlled input:
# box sizes, item counts, iloc widths / offsets / extents, ipma
# indices, iref graphs (cycles, fan-out bombs), grid / iovl
# descriptors (canvas sizes, offsets), sample tables (stsc / stsz /
# stco expansion). Every target asserts "the call returns" — no panic,
# abort or unbounded allocation — on arbitrary bytes.
#
#  * `heif_parse`    — ftyp + meta tree, item payload resolution for
#                      every item (all three construction methods,
#                      multi-extent, cm=2 chains), typed properties,
#                      the derivation graph of every image item, the
#                      MIAF checks and the bounded box walk.
#  * `heif_compose`  — grid / iovl descriptor parse + pixel
#                      composition on small synthetic tiles whose
#                      geometry / alpha / offsets come from the input,
#                      followed by the clap / irot / imir chain.
#  * `heif_sequence` — moov / trak / stbl walk, sample-table expansion
#                      and sample byte resolution, plus the track
#                      matrix decode, sample groups.
#  * `heif_records`  — the typed record parsers (tmap body, HDR boxes,
#                      avcC / lhvC / oinf / tols, sbgp / csgp / sgpd,
#                      prft / ssix, every typed property) with a
#                      serialize → parse round-trip oracle.
#  * `heif_api`      — the standalone image-crate contract: `probe`,
#                      `info` / `info_of`, the limit checks.
#  * `heif_decode`   — the registry contract: `decode_with` /
#                      `decode_rgba8` / `decode_all_with` under tight
#                      `DecodeOptions` limits (container → codec →
#                      composition → RGB; seeded with the corpus files).
#
# `heif_decode` needs the default `registry` feature (the codec crates
# have their own harnesses; here they are reached only through valid
# HEIF structure); the other targets exercise the standalone surface.

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.oxideav-heif]
path = ".."

# Prevent this fuzz package from being pulled into the umbrella
# workspace at `crates/*` glob-resolve time.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "heif_parse"
path = "fuzz_targets/heif_parse.rs"
test = false
doc = false

[[bin]]
name = "heif_compose"
path = "fuzz_targets/heif_compose.rs"
test = false
doc = false

[[bin]]
name = "heif_sequence"
path = "fuzz_targets/heif_sequence.rs"
test = false
doc = false

[[bin]]
name = "heif_records"
path = "fuzz_targets/heif_records.rs"
test = false
doc = false

[[bin]]
name = "heif_api"
path = "fuzz_targets/heif_api.rs"
test = false
doc = false

[[bin]]
name = "heif_decode"
path = "fuzz_targets/heif_decode.rs"
test = false
doc = false
